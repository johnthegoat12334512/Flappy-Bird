<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Moth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap">
<style>
/* Layout: one-screen arcade cabinet, the canvas centered at a fixed 2:3 aspect, HUD drawn inside it. Single dusk look by choice. */
:root {
  --night: #141a2e;
  --dusk: #2b2547;
  --glow: #ffcf6b;
  --ink: #f4ecdc;
  --muted: #9a93b8;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-display);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
#stage {
  position: relative;
  height: min(100%, 720px);
  max-height: calc(100% - 34px);
  aspect-ratio: 2 / 3;
  max-width: 100%;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 1px #ffffff14, 0 20px 60px #0008;
}
canvas { display: block; width: 100%; height: 100%; cursor: pointer; outline: none; }
canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--glow); }
.hint { color: var(--muted); font-size: 13px; letter-spacing: .04em; margin: 0; text-align: center; }
.hint kbd { font-family: inherit; color: var(--ink); border: 1px solid #ffffff30; border-radius: 4px; padding: 0 5px; }
</style>

</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Lantern Moth game. Press space, click or tap to flap."></canvas></div>
<p class="hint">Flap with <kbd>Space</kbd>, click or tap · <kbd>P</kbd> pauses</p>

<script>
(() => {
  const W = 400, H = 600, GROUND = 540;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Tuning
  const GRAV = 1500, FLAP = -430, SPEED = 150, GAP = 165, SPACING = 220, TRUNK_W = 64;

  let best = 0;
  try { best = +localStorage.getItem('lantern-moth-best') || 0; } catch (e) {}

  let state, moth, trunks, score, t, scroll, flash, paused;
  const stars = Array.from({length: 40}, () => ({x: Math.random()*W, y: Math.random()*300, r: Math.random()*1.4+.3, p: Math.random()*6}));
  const fireflies = Array.from({length: 14}, () => ({x: Math.random()*W, y: 200+Math.random()*320, p: Math.random()*6}));

  function reset() {
    state = 'ready'; score = 0; t = 0; flash = 0; paused = false;
    moth = {x: 110, y: 280, vy: 0, rot: 0};
    trunks = [];
    for (let i = 0; i < 3; i++) addTrunk(W + 120 + i * SPACING);
  }
  function addTrunk(x) {
    const min = 90, max = GROUND - GAP - 70;
    trunks.push({x, gapY: min + Math.random() * (max - min), scored: false, knots: Math.random()});
  }

  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 3);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  new ResizeObserver(resize).observe(cv);

  // Tiny synth for sound, started on first interaction
  let ac = null;
  function beep(f0, f1, dur, type = 'sine', vol = .08) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f1, n + dur);
      g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + dur);
      o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
    } catch (e) {}
  }

  function flap() {
    if (paused) { paused = false; return; }
    if (state === 'over') { if (t > .5) reset(); return; }
    if (state === 'ready') state = 'play';
    moth.vy = FLAP;
    beep(520, 780, .09, 'triangle', .05);
  }
  function die() {
    if (state !== 'play') return;
    state = 'over'; t = 0; flash = 1;
    beep(300, 60, .4, 'sawtooth', .06);
    if (score > best) { best = score; try { localStorage.setItem('lantern-moth-best', best); } catch (e) {} }
  }

  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) flap(); }
    if (e.code === 'KeyP' && state === 'play') paused = !paused;
  });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); flap(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

  function update(dt) {
    t += dt;
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (state !== 'over') scroll += SPEED * dt;
    if (state === 'ready') { moth.y = 280 + Math.sin(t * 3) * 10; moth.rot = 0; return; }

    moth.vy += GRAV * dt;
    moth.y += moth.vy * dt;
    moth.rot = Math.max(-.5, Math.min(1.3, moth.vy / 600));

    if (state === 'play') {
      for (const tr of trunks) {
        tr.x -= SPEED * dt;
        if (!tr.scored && tr.x + TRUNK_W < moth.x) { tr.scored = true; score++; beep(880, 1320, .12, 'sine', .05); }
        // collision with circle radius 13
        const r = 13, cx = Math.max(tr.x, Math.min(moth.x, tr.x + TRUNK_W));
        if (Math.abs(cx - moth.x) < r && (moth.y - r < tr.gapY || moth.y + r > tr.gapY + GAP)) die();
      }
      if (trunks[0].x < -TRUNK_W - 10) { trunks.shift(); addTrunk(trunks[trunks.length - 1].x + SPACING); }
      if (moth.y < -40) moth.y = -40, moth.vy = 0;
    }
    if (moth.y + 13 > GROUND) { moth.y = GROUND - 13; moth.vy = 0; die(); }
  }

  function draw() {
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#141a2e'); sky.addColorStop(.6, '#2b2547'); sky.addColorStop(1, '#5a3a55');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = .4 + .5 * Math.sin(t * 2 + s.p) ** 2;
      ctx.fillStyle = '#f4ecdc'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // moon
    ctx.fillStyle = '#f7e7c4'; ctx.beginPath(); ctx.arc(310, 90, 30, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8d3a8'; ctx.beginPath(); ctx.arc(300, 82, 6, 0, 7); ctx.arc(320, 104, 4, 0, 7); ctx.fill();
    // far hills (parallax)
    hills(.15, 430, 60, '#241f3d'); hills(.35, 470, 40, '#1c1930');

    // fireflies
    for (const f of fireflies) {
      const x = ((f.x - scroll * .5) % W + W) % W, y = f.y + Math.sin(t + f.p) * 12;
      ctx.globalAlpha = .3 + .7 * Math.sin(t * 3 + f.p) ** 2;
      ctx.fillStyle = '#ffcf6b'; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const tr of trunks) trunk(tr);

    // ground
    ctx.fillStyle = '#16122a'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#2e4a3a'; ctx.fillRect(0, GROUND, W, 8);
    ctx.fillStyle = '#3d6650';
    for (let i = -1; i < W / 16 + 1; i++) {
      const x = i * 16 - (scroll % 16);
      ctx.beginPath(); ctx.moveTo(x, GROUND + 8); ctx.lineTo(x + 8, GROUND - 4); ctx.lineTo(x + 16, GROUND + 8); ctx.fill();
    }

    drawMoth();

    // HUD
    ctx.textAlign = 'center'; ctx.font = '800 54px "Baloo 2", system-ui, sans-serif';
    if (state !== 'ready') shadowText(String(score), W / 2, 86);
    if (state === 'ready') {
      ctx.font = '800 46px "Baloo 2", system-ui, sans-serif'; shadowText('Lantern Moth', W / 2, 150, '#ffcf6b');
      ctx.font = '500 20px "Baloo 2", system-ui, sans-serif'; shadowText('Tap to flutter between the pines', W / 2, 186);
      if (best) shadowText('Best ' + best, W / 2, 400);
    }
    if (state === 'over') panel();
    if (paused) {
      ctx.fillStyle = '#0009'; ctx.fillRect(0, 0, W, H);
      ctx.font = '800 40px "Baloo 2", system-ui, sans-serif'; shadowText('Paused', W / 2, 290);
      ctx.font = '500 18px "Baloo 2", system-ui, sans-serif'; shadowText('Tap or press Space to resume', W / 2, 322);
    }
    if (flash > 0 && !reduced) { ctx.fillStyle = `rgba(255,240,210,${flash * .6})`; ctx.fillRect(0, 0, W, H); }
  }

  function hills(par, base, amp, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 10) { const u = x + scroll * par; ctx.lineTo(x, base - Math.sin(u / 70) * amp * .5 - Math.sin(u / 31) * amp * .25); }
    ctx.lineTo(W, GROUND); ctx.fill();
  }

  function trunk(tr) {
    const {x, gapY} = tr;
    const bark = ctx.createLinearGradient(x, 0, x + TRUNK_W, 0);
    bark.addColorStop(0, '#3a2a2a'); bark.addColorStop(.35, '#6b4a3a'); bark.addColorStop(1, '#2a1e22');
    ctx.fillStyle = bark;
    ctx.fillRect(x, 0, TRUNK_W, gapY); ctx.fillRect(x, gapY + GAP, TRUNK_W, GROUND - gapY - GAP);
    // bark lines
    ctx.strokeStyle = '#00000040'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const lx = x + 14 + k * 17; ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, gapY - 18); ctx.moveTo(lx, gapY + GAP + 18); ctx.lineTo(lx, GROUND); ctx.stroke();
    }
    // branch caps with lanterns hanging into the gap
    ctx.fillStyle = '#4a3530';
    rr(x - 8, gapY - 20, TRUNK_W + 16, 20, 6); rr(x - 8, gapY + GAP, TRUNK_W + 16, 20, 6);
    ctx.fillStyle = '#3d6650';
    rr(x - 12, gapY - 26, TRUNK_W + 24, 10, 5); rr(x - 12, gapY + GAP + 16, TRUNK_W + 24, 10, 5);
    // lantern
    const lx = x + TRUNK_W / 2 + (tr.knots - .5) * 20, ly = gapY + 14, sw = reduced ? 0 : Math.sin(t * 2 + tr.knots * 6) * 3;
    ctx.strokeStyle = '#2a1e22'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, gapY - 2); ctx.lineTo(lx + sw, ly); ctx.stroke();
    const glow = ctx.createRadialGradient(lx + sw, ly + 8, 0, lx + sw, ly + 8, 46);
    glow.addColorStop(0, '#ffcf6b70'); glow.addColorStop(1, '#ffcf6b00');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(lx + sw, ly + 8, 46, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcf6b'; rr(lx + sw - 6, ly, 12, 16, 4);
    ctx.fillStyle = '#c0583d'; ctx.fillRect(lx + sw - 7, ly - 1, 14, 3); ctx.fillRect(lx + sw - 7, ly + 14, 14, 3);
  }

  function drawMoth() {
    const {x, y, rot} = moth;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const beat = state === 'over' ? .2 : Math.sin(t * (moth.vy < 0 ? 40 : 18)) * .5 + .5;
    // glow
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 34); g.addColorStop(0, '#fff4d040'); g.addColorStop(1, '#fff4d000');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill();
    // wings
    for (const s of [-1, 1]) {
      ctx.save(); ctx.scale(1, s * (.35 + beat * .65));
      ctx.fillStyle = '#e9d9b8'; ctx.beginPath(); ctx.ellipse(-4, -12, 13, 11, -.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9a77a'; ctx.beginPath(); ctx.ellipse(-6, -13, 4, 3.5, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    // body
    ctx.fillStyle = '#8a6a55'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#6b4f40'; for (let i = -6; i <= 2; i += 4) ctx.fillRect(i, -5, 1.5, 10);
    // head, eye, antennae
    ctx.fillStyle = '#a07e66'; ctx.beginPath(); ctx.arc(12, -1, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#141a2e'; ctx.beginPath(); ctx.arc(14, -2, 1.8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6b4f40'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(14, -5); ctx.quadraticCurveTo(20, -14, 24, -12); ctx.moveTo(12, -5); ctx.quadraticCurveTo(15, -15, 20, -16); ctx.stroke();
    ctx.restore();
  }

  function panel() {
    const k = Math.min(1, t * 4), y = 190 + (1 - k) * 40;
    ctx.globalAlpha = k;
    ctx.fillStyle = '#141a2ee6'; rr(60, y, 280, 210, 18);
    ctx.strokeStyle = '#ffcf6b80'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(60, y, 280, 210, 18); ctx.stroke();
    ctx.font = '800 36px "Baloo 2", system-ui, sans-serif'; shadowText('Singed!', W / 2, y + 50, '#ffcf6b');
    ctx.font = '500 16px "Baloo 2", system-ui, sans-serif'; ctx.fillStyle = '#9a93b8';
    ctx.fillText('LANTERNS', 140, y + 88); ctx.fillText('BEST', 260, y + 88);
    ctx.font = '800 40px "Baloo 2", system-ui, sans-serif'; ctx.fillStyle = '#f4ecdc';
    ctx.fillText(score, 140, y + 128); ctx.fillText(best, 260, y + 128);
    const m = medal(score);
    if (m) { ctx.font = '500 16px "Baloo 2", system-ui, sans-serif'; ctx.fillStyle = m[1]; ctx.fillText(m[0], W / 2, y + 160); }
    if (t > .5) { ctx.font = '500 17px "Baloo 2", system-ui, sans-serif'; ctx.fillStyle = '#f4ecdc'; ctx.fillText('Tap to fly again', W / 2, y + 190); }
    ctx.globalAlpha = 1;
  }
  const medal = s => s >= 40 ? ['Moon moth', '#f7e7c4'] : s >= 20 ? ['Lantern keeper', '#ffcf6b'] : s >= 10 ? ['Night flier', '#d9b38c'] : null;

  function shadowText(s, x, y, color = '#f4ecdc') {
    ctx.fillStyle = '#0008'; ctx.fillText(s, x + 2, y + 3);
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

  scroll = 0; reset(); resize();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.fonts && document.fonts.ready.then(() => {});
})();
</script>


</body>
</html>
